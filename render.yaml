# Blueprint example: do not deploy until secrets and StaffFlow gateway are configured.
services:
  - type: web
    name: bot-points-secure
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT render_app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BOT_POINTS_GATEWAY_SECRET
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
