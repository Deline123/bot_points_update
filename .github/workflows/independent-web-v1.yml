name: BOT Point independent web checks
on:
  push:
    branches: [feature/independent-web-v1]
  pull_request:
    branches: [feature/render-standalone-v399]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: points_test
          POSTGRES_PASSWORD: points_test
          POSTGRES_DB: points_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U points_test -d points_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-render.txt
      - run: python -m compileall -q app.py gateway_auth.py neon_store.py history_sync.py render_worker.py runtime_control.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Real PostgreSQL cross-process advisory lock and ingestion test
        env:
          POINTS_TEST_POSTGRES: postgresql://points_test:points_test@127.0.0.1:5432/points_test
        run: python -m unittest discover -s tests -p 'test_runtime_postgres.py' -v
      - name: Verify browser script syntax
        run: |
          python -c "import re,pathlib; s=pathlib.Path('templates/index.html').read_text(); pathlib.Path('/tmp/points.js').write_text(re.findall(r'<script>([\s\S]*?)</script>',s)[0])"
          node --check /tmp/points.js
